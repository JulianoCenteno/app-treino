<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14120F;
    --surface:#1E1B18;
    --surface-2:#262220;
    --border:#37322C;
    --text:#F4F0E8;
    --text-dim:#9C948A;
    --accent:#E4772C;
    --accent-dim:#E4772C33;
    --success:#5FAE7A;
    --success-dim:#5FAE7A26;
    --radius:14px;
    --dc:#3E5C9A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    padding:18px 16px 40px;
  }
  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .wordmark{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    line-height:1;
  }
  .wordmark .dot{color:var(--accent);}
  .today{
    flex:1;
    text-align:left;
    font-size:12.5px;
    color:var(--text-dim);
    margin-left:10px;
    text-transform:capitalize;
  }
  .streak{
    font-size:13px;
    font-weight:600;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .weekdots{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .weekdots .wd{
    flex:1;
    text-align:center;
    padding:6px 0 7px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--border);
  }
  .weekdots .wd .lbl{
    display:block;
    font-size:9.5px;
    color:var(--text-dim);
    margin-bottom:4px;
    font-weight:600;
  }
  .weekdots .wd .pip{
    width:7px;height:7px;border-radius:50%;
    background:var(--border);
    margin:0 auto;
  }
  .weekdots .wd.done .pip{background:var(--success);}
  .weekdots .wd.today{border-color:var(--accent);}

  .restnote{
    background:var(--surface);
    border:1px dashed var(--border);
    color:var(--text-dim);
    font-size:13px;
    padding:10px 12px;
    border-radius:var(--radius);
    margin-bottom:14px;
  }

  /* ---------- day pills ---------- */
  .daypills{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:18px;
    scrollbar-width:none;
  }
  .daypills::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .pill .pip{
    display:inline-block;
    width:6px;height:6px;border-radius:50%;
    margin-left:6px;
    background:var(--success);
    vertical-align:middle;
  }
  .pill.active{
    color:#fff;
    border-color:transparent;
    background:var(--pill-color, var(--dc));
  }

  /* ---------- workout head ---------- */
  .workout-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .workout-head .bar{
    width:5px;
    align-self:stretch;
    min-height:44px;
    border-radius:3px;
    background:var(--dc);
  }
  .workout-head h1{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:24px;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing:0.3px;
  }
  .workout-head p{
    margin:0;
    font-size:13px;
    color:var(--text-dim);
  }
  .workout-head .progress{
    margin-left:auto;
    text-align:right;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--dc);
    white-space:nowrap;
  }

  /* ---------- exercise cards ---------- */
  .exercise-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .exercise-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px 14px;
    transition:background-color .5s ease, border-color .3s ease;
  }
  .exercise-card.is-done{
    border-color:var(--success-dim);
  }
  .exercise-card.flash{
    background-color:var(--success-dim);
  }
  .exercise-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:2px;
  }
  .exercise-head h3{
    margin:0;
    font-size:15px;
    font-weight:600;
  }
  .exercise-head .target{
    font-size:11.5px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .hint{
    font-size:11.5px;
    color:var(--dc);
    margin-bottom:8px;
  }
  .sets{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .set-row{
    display:grid;
    grid-template-columns:32px 56px 1fr 1fr;
    align-items:center;
    gap:8px;
  }
  .set-num{
    font-size:12px;
    color:var(--text-dim);
  }
  .check{
    width:26px;height:26px;
    border-radius:50%;
    border:1.5px solid var(--border);
    background:transparent;
    padding:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .check:active{transform:scale(0.88);}
  .check svg{width:13px;height:13px;opacity:0;transition:opacity .1s ease;}
  .check.checked{
    background:var(--success);
    border-color:var(--success);
  }
  .check.checked svg{opacity:1;}
  .set-row input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:7px 8px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    text-align:center;
  }
  .set-row input:focus{
    outline:none;
    border-color:var(--dc);
  }
  .set-row input::placeholder{color:#6b665f;}
  /* remove number spinners for a cleaner look */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  /* ---------- cta ---------- */
  .cta{
    width:100%;
    padding:14px;
    border:none;
    border-radius:var(--radius);
    background:var(--accent);
    color:#1A1006;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .1s ease, background .2s ease, opacity .2s ease;
  }
  .cta:active{transform:scale(0.985);}
  .cta.done{
    background:var(--success-dim);
    color:var(--success);
    border:1px solid var(--success);
  }
  .cta.ready{
    box-shadow:0 0 0 3px var(--accent-dim);
  }

  /* ---------- history ---------- */
  .history{margin-top:28px;}
  .history h4{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--text-dim);
    margin:0 0 10px;
  }
  .hist-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .hist-date{color:var(--text-dim);width:44px;flex:0 0 auto;}
  .hist-day{flex:1;font-weight:500;}
  .hist-status{font-size:12px;color:var(--text-dim);}
  .hist-status.complete{color:var(--success);}
  .empty-hist{color:var(--text-dim);font-size:13px;}
  .clear-link{
    margin-top:12px;
    background:none;border:none;
    color:var(--text-dim);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,20px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:20;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%,0);
  }

  .loading{
    color:var(--text-dim);
    font-size:13.5px;
    padding:30px 0;
    text-align:center;
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="wordmark">TREINO<span class="dot">.</span></div>
    <div class="today" id="todayLabel"></div>
    <div class="streak" id="streakChip">🔥 0</div>
  </div>

  <div class="weekdots" id="weekDots"></div>

  <div class="restnote" id="restNote" hidden>Hoje é domingo — dia de descanso. Escolha um treino abaixo se quiser adiantar ou repor.</div>

  <nav class="daypills" id="dayPills"></nav>

  <main id="workoutRoot">
    <div class="loading">Carregando seu histórico…</div>
  </main>

  <div class="history" id="historyRoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  const PLAN = [
    { key:'seg', short:'Seg', full:'Segunda-feira', title:'Braços A', subtitle:'Bíceps e tríceps · descansado, sem sobra de peito/costas', color:'#3E5C9A',
      exercises:[
        {name:'Rosca direta barra W', sets:4, reps:'6–8'},
        {name:'Supino fechado', sets:4, reps:'6–8'},
        {name:'Rosca Scott', sets:3, reps:'8–10'},
        {name:'Tríceps testa', sets:3, reps:'8–10'},
        {name:'Rosca martelo', sets:3, reps:'10–12'},
        {name:'Tríceps corda', sets:3, reps:'10–12'},
        {name:'Elevação lateral', sets:3, reps:'12–15'},
      ]},
    { key:'ter', short:'Ter', full:'Terça-feira', title:'Peito + Ombros', subtitle:'Priorize carga nos compostos', color:'#2F7A66',
      exercises:[
        {name:'Supino reto barra', sets:4, reps:'5–8'},
        {name:'Supino inclinado halteres', sets:3, reps:'8–10'},
        {name:'Crucifixo máquina / crossover', sets:3, reps:'10–15'},
        {name:'Desenvolvimento com halteres', sets:3, reps:'6–10'},
        {name:'Elevação lateral', sets:4, reps:'12–15'},
        {name:'Crucifixo inverso', sets:3, reps:'12–15'},
      ]},
    { key:'qua', short:'Qua', full:'Quarta-feira', title:'Pernas A', subtitle:'Quadríceps · técnica e controle', color:'#9A3B3B',
      exercises:[
        {name:'Agachamento livre', sets:4, reps:'6–8'},
        {name:'Leg press', sets:4, reps:'8–12'},
        {name:'Hack squat', sets:3, reps:'8–12'},
        {name:'Cadeira extensora', sets:3, reps:'12–15'},
        {name:'Mesa flexora', sets:3, reps:'10–12'},
        {name:'Panturrilha em pé', sets:4, reps:'10–15'},
      ]},
    { key:'qui', short:'Qui', full:'Quinta-feira', title:'Costas + Braços B', subtitle:'Dorsal prioridade, abaixo de braços/ombros/peito', color:'#6C4FA0',
      exercises:[
        {name:'Puxada frente aberta', sets:4, reps:'6–10'},
        {name:'Remada apoiada / máquina', sets:4, reps:'8–10'},
        {name:'Puxada neutra', sets:3, reps:'10–12'},
        {name:'Rosca inclinada halteres', sets:3, reps:'8–12'},
        {name:'Rosca martelo', sets:3, reps:'10–12'},
        {name:'Tríceps francês', sets:3, reps:'8–12'},
        {name:'Tríceps corda', sets:3, reps:'10–15'},
      ]},
    { key:'sex', short:'Sex', full:'Sexta-feira', title:'Ombros + Peito + Tríceps', subtitle:'Segunda exposição, sem repetir terça', color:'#B8862E',
      exercises:[
        {name:'Desenvolvimento máquina', sets:3, reps:'6–10'},
        {name:'Elevação lateral halteres', sets:4, reps:'10–15'},
        {name:'Elevação lateral no cabo', sets:3, reps:'12–15'},
        {name:'Crucifixo inverso', sets:3, reps:'12–15'},
        {name:'Supino inclinado máquina', sets:3, reps:'8–12'},
        {name:'Crossover', sets:3, reps:'12–15'},
        {name:'Tríceps unilateral no cabo', sets:3, reps:'10–15'},
      ]},
    { key:'sab', short:'Sáb', full:'Sábado', title:'Pernas B', subtitle:'Posterior e glúteos', color:'#3E8FBF',
      exercises:[
        {name:'Stiff / terra romeno', sets:4, reps:'6–10'},
        {name:'Mesa flexora', sets:4, reps:'8–12'},
        {name:'Agachamento búlgaro', sets:3, reps:'8–12 (cada)'},
        {name:'Leg press pés mais altos', sets:3, reps:'10–12'},
        {name:'Cadeira flexora', sets:3, reps:'12–15'},
        {name:'Panturrilha sentado', sets:4, reps:'12–15'},
      ]},
  ];
  const PLAN_BY_KEY = Object.fromEntries(PLAN.map(d=>[d.key,d]));
  const WEEKDAY_KEYS = ['rest','seg','ter','qua','qui','sex','sab']; // JS getDay(): 0=Sun..6=Sat

  let history = [];       // array of session records, loaded from storage
  let selectedDay = null; // current day key being viewed
  let storageOk = true;

  // ---------- date helpers ----------
  function isoOf(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayISO(){ return isoOf(new Date()); }
  function fmtShort(iso){
    const [y,m,d] = iso.split('-');
    return `${d}/${m}`;
  }
  function mondayOfWeek(d){
    const date = new Date(d);
    const day = date.getDay(); // 0 sun .. 6 sat
    const diff = day===0 ? -6 : 1-day;
    date.setDate(date.getDate()+diff);
    date.setHours(0,0,0,0);
    return date;
  }

  // ---------- storage ----------
  async function loadHistory(){
    try{
      const res = await window.storage.get('history', false);
      if(res && res.value) return JSON.parse(res.value);
      return [];
    }catch(e){
      return [];
    }
  }
  async function persistHistory(){
    try{
      await window.storage.set('history', JSON.stringify(history), false);
    }catch(e){
      storageOk = false;
    }
  }

  // ---------- session helpers ----------
  function emptySets(n){
    return Array.from({length:n}, ()=>({weight:'',reps:'',done:false}));
  }
  function findSession(dayKey, date){
    return history.find(s=>s.dayKey===dayKey && s.date===date);
  }
  function getOrCreateTodaySession(dayKey){
    const date = todayISO();
    let s = findSession(dayKey, date);
    if(s) return s;
    const plan = PLAN_BY_KEY[dayKey];
    s = {
      date, dayKey,
      exercises: plan.exercises.map(ex=>({name:ex.name, sets: emptySets(ex.sets)})),
      completed:false
    };
    history.push(s);
    return s;
  }
  function lastValueFor(dayKey, exName){
    const past = history
      .filter(s=>s.dayKey===dayKey && s.date!==todayISO())
      .sort((a,b)=> a.date < b.date ? 1 : -1);
    for(const s of past){
      const ex = s.exercises.find(e=>e.name===exName);
      if(!ex) continue;
      const filled = [...ex.sets].reverse().find(st=>st.weight!=='' && st.weight!=null);
      if(filled) return `${filled.weight}kg × ${filled.reps || '?'}`;
    }
    return null;
  }
  function doneDatesSet(){
    return new Set(history.filter(s=>s.completed).map(s=>s.date));
  }
  function computeStreak(){
    const doneDates = doneDatesSet();
    let cursor = new Date();
    if(!doneDates.has(todayISO())) cursor.setDate(cursor.getDate()-1);
    let streak=0;
    while(doneDates.has(isoOf(cursor))){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }
    return streak;
  }

  // ---------- rendering ----------
  const checkIconSVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#12100D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderTopMeta(){
    const d = new Date();
    const label = d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('todayLabel').textContent = label;
    document.getElementById('streakChip').textContent = `🔥 ${computeStreak()}`;

    document.getElementById('restNote').hidden = d.getDay() !== 0;

    // week dots (mon-sat)
    const mon = mondayOfWeek(d);
    const doneDates = doneDatesSet();
    const wd = document.getElementById('weekDots');
    wd.innerHTML = '';
    for(let i=0;i<6;i++){
      const day = new Date(mon);
      day.setDate(mon.getDate()+i);
      const iso = isoOf(day);
      const planDay = PLAN[i];
      const isToday = iso===todayISO();
      const el = document.createElement('div');
      el.className = 'wd' + (doneDates.has(iso)?' done':'') + (isToday?' today':'');
      el.innerHTML = `<span class="lbl">${planDay.short}</span><span class="pip"></span>`;
      wd.appendChild(el);
    }
  }

  function renderPills(){
    const nav = document.getElementById('dayPills');
    nav.innerHTML = '';
    const doneDates = doneDatesSet();
    PLAN.forEach(d=>{
      const btn = document.createElement('button');
      const isDoneToday = doneDates.has(todayISO()) && findSession(d.key, todayISO())?.completed;
      btn.className = 'pill' + (d.key===selectedDay?' active':'');
      btn.style.setProperty('--pill-color', d.color);
      btn.innerHTML = d.short + (isDoneToday ? '<span class="pip"></span>' : '');
      btn.addEventListener('click', ()=> selectDay(d.key));
      nav.appendChild(btn);
    });
  }

  function progressFor(session){
    const total = session.exercises.reduce((a,e)=>a+e.sets.length,0);
    const done = session.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    return {done, total};
  }

  function renderWorkout(){
    const plan = PLAN_BY_KEY[selectedDay];
    const session = getOrCreateTodaySession(selectedDay);
    const root = document.getElementById('workoutRoot');
    const {done, total} = progressFor(session);

    root.innerHTML = `
      <div class="workout-head" style="--dc:${plan.color}">
        <div class="bar"></div>
        <div>
          <h1>${plan.title}</h1>
          <p>${plan.subtitle}</p>
        </div>
        <div class="progress">${done}/${total}<br><span style="font-family:'Inter';font-weight:400;font-size:10.5px;color:var(--text-dim)">séries</span></div>
      </div>
      <div class="exercise-list" id="exList"></div>
      <button class="cta ${session.completed ? 'done':''} ${(!session.completed && done===total && total>0) ? 'ready':''}" id="completeBtn">
        ${session.completed ? 'Treino concluído — toque para reabrir' : 'Concluir treino de hoje'}
      </button>
    `;

    const exList = document.getElementById('exList');
    session.exercises.forEach((ex, exIdx)=>{
      const planEx = plan.exercises[exIdx];
      const exDone = ex.sets.every(s=>s.done);
      const hint = lastValueFor(selectedDay, ex.name);
      const card = document.createElement('div');
      card.className = 'exercise-card' + (exDone ? ' is-done' : '');
      card.dataset.exIdx = exIdx;

      let setsHtml = '';
      ex.sets.forEach((st, sIdx)=>{
        setsHtml += `
          <div class="set-row" data-set-idx="${sIdx}">
            <button class="check ${st.done?'checked':''}" data-action="toggle">${checkIconSVG}</button>
            <span class="set-num">Série ${sIdx+1}</span>
            <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" data-field="weight" value="${st.weight}">
            <input type="number" inputmode="numeric" step="1" min="0" placeholder="reps" data-field="reps" value="${st.reps}">
          </div>`;
      });

      card.innerHTML = `
        <div class="exercise-head">
          <h3>${ex.name}</h3>
          <span class="target">alvo ${planEx.sets}×${planEx.reps}</span>
        </div>
        ${hint ? `<div class="hint">Última vez: ${hint}</div>` : ''}
        <div class="sets">${setsHtml}</div>
      `;
      exList.appendChild(card);
    });

    document.getElementById('completeBtn').addEventListener('click', onToggleComplete);
  }

  function renderHistory(){
    const root = document.getElementById('historyRoot');
    const recent = [...history].sort((a,b)=> a.date < b.date ? 1 : -1).slice(0,6);
    let rowsHtml = '';
    if(recent.length===0){
      rowsHtml = '<p class="empty-hist">Seus treinos concluídos vão aparecer aqui.</p>';
    } else {
      rowsHtml = recent.map(s=>{
        const plan = PLAN_BY_KEY[s.dayKey];
        const {done,total} = progressFor(s);
        return `
          <div class="hist-row">
            <span class="hist-dot" style="background:${plan.color}"></span>
            <span class="hist-date">${fmtShort(s.date)}</span>
            <span class="hist-day">${plan.full} · ${plan.title}</span>
            <span class="hist-status ${s.completed?'complete':''}">${s.completed ? 'concluído' : done+'/'+total}</span>
          </div>`;
      }).join('');
    }
    root.innerHTML = `
      <h4>Histórico recente</h4>
      ${rowsHtml}
      ${history.length ? '<button class="clear-link" id="clearBtn">Apagar todo o histórico</button>' : ''}
    `;
    const clearBtn = document.getElementById('clearBtn');
    if(clearBtn) clearBtn.addEventListener('click', onClearHistory);
  }

  function renderAll(){
    renderTopMeta();
    renderPills();
    renderWorkout();
    renderHistory();
  }

  // ---------- interactions ----------
  function selectDay(key){
    selectedDay = key;
    renderAll();
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  document.getElementById('workoutRoot').addEventListener('click', (e)=>{
    const checkBtn = e.target.closest('[data-action="toggle"]');
    if(!checkBtn) return;
    const card = e.target.closest('.exercise-card');
    const row = e.target.closest('.set-row');
    const exIdx = Number(card.dataset.exIdx);
    const sIdx = Number(row.dataset.setIdx);
    const session = getOrCreateTodaySession(selectedDay);
    const set = session.exercises[exIdx].sets[sIdx];
    set.done = !set.done;
    checkBtn.classList.toggle('checked', set.done);

    const allDone = session.exercises[exIdx].sets.every(s=>s.done);
    card.classList.toggle('is-done', allDone);
    if(allDone){
      card.classList.add('flash');
      setTimeout(()=>card.classList.remove('flash'), 600);
    }
    // refresh header progress + cta readiness without a full re-render
    const {done,total} = progressFor(session);
    const progEl = document.querySelector('.workout-head .progress');
    if(progEl) progEl.innerHTML = `${done}/${total}<br><span style="font-family:'Inter';font-weight:400;font-size:10.5px;color:var(--text-dim)">séries</span>`;
    const cta = document.getElementById('completeBtn');
    if(cta && !session.completed) cta.classList.toggle('ready', done===total && total>0);

    persistHistory();
  });

  document.getElementById('workoutRoot').addEventListener('change', (e)=>{
    const input = e.target.closest('input[data-field]');
    if(!input) return;
    const card = e.target.closest('.exercise-card');
    const row = e.target.closest('.set-row');
    const exIdx = Number(card.dataset.exIdx);
    const sIdx = Number(row.dataset.setIdx);
    const session = getOrCreateTodaySession(selectedDay);
    session.exercises[exIdx].sets[sIdx][input.dataset.field] = input.value;
    persistHistory();
  });

  function onToggleComplete(){
    const session = getOrCreateTodaySession(selectedDay);
    session.completed = !session.completed;
    persistHistory();
    if(session.completed) showToast('Treino concluído. Bom trabalho! 💪');
    renderAll();
  }

  function onClearHistory(){
    if(!confirm('Apagar todo o histórico de treinos salvo neste dispositivo? Essa ação não pode ser desfeita.')) return;
    history = [];
    persistHistory();
    renderAll();
    showToast('Histórico apagado.');
  }

  // ---------- boot ----------
  (async function init(){
    history = await loadHistory();
    const todayKey = WEEKDAY_KEYS[new Date().getDay()];
    selectedDay = todayKey==='rest' ? 'seg' : todayKey;
    renderAll();
    if(!storageOk){
      showToast('Não foi possível salvar seus dados agora.');
    }
  })();

})();
</script>
</body>
</html>
